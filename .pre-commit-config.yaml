repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: ruff check
        entry: uv run ruff check
        language: system
        types: [python]
      - id: ruff-format
        name: ruff format
        entry: uv run ruff format
        language: system
        types: [python]
      - id: unittest
        name: unit tests
        entry: uv run python -m unittest discover -s tests -t .
        language: system
        types: [python]
        pass_filenames: false
